  <script src="shared/core/ebp-core.js"></script>

  <script src="shared/js/components.js"></script>
  <script>
    const statusEl = document.getElementById('lyrics-status');
    fetch('data/missing_lyrics.json')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => {
        const container = document.getElementById('lyricsContent');
        let releases = 0, tracks = 0;
        Object.entries(data).forEach(([releaseTitle, releaseData]) => {
          const artists = [];
          Object.values(releaseData.tracks).forEach(track => {
            if (track.artist && !artists.includes(track.artist)) artists.push(track.artist);
          });
          const artistDisplay = artists.length === 1 ? artists[0] : "Various Artists";

          const section = document.createElement('section');
          section.className = 'lyrics-section';

          const h2 = document.createElement('h2');
          h2.textContent = artistDisplay + ' – ' + releaseTitle;
          section.appendChild(h2);

          const ul = document.createElement('ul');
          Object.entries(releaseData.tracks).forEach(([trackTitle, trackData]) => {
            if (!trackData.lyrics || trackData.lyrics.trim() === "") {
              const li = document.createElement('li');
              li.textContent = artistDisplay === "Various Artists"
                ? trackData.artist + ' – ' + trackTitle
                : trackTitle;
              ul.appendChild(li);
            }
          });
          section.appendChild(ul);
          if (ul.children.length > 0) { container.appendChild(section); releases++; tracks += ul.children.length; }
        });
        VEBP.announce(statusEl, tracks + ' tracks on ' + releases + ' releases are missing lyrics.');
      })
      .catch(err => {
        console.error('Failed to load missing lyrics:', err);
        VEBP.announce(statusEl, '');
        const n = document.createElement('div');
        n.className = 'ebp-notice ebp-notice--accent';
        n.setAttribute('role', 'alert');
        n.textContent = 'Error loading missing lyrics data.';
        document.getElementById('lyricsContent').appendChild(n);
      });
  </script>
